spring:
  application:
    name: inventory-svc
  profiles:
    # Local/dev boot works out of the box; production must set
    # SPRING_PROFILES_ACTIVE=prod and provide the environment variables.
    default: dev
  threads:
    virtual:
      enabled: true
  jpa:
    # OSIV keeps the request-scoped persistence context (with rollback
    # residual state) alive across the optimistic-lock retry attempts of one
    # request, so retried transactions would read a stale snapshot
    # (P3-F2-S2). No lazy associations exist in this service — off is safe.
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
inventory:
  relay:
    enabled: true
