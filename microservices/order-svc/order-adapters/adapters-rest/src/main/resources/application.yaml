spring:
  application:
    name: order-svc
  profiles:
    # Local/dev boot works out of the box; production must set
    # SPRING_PROFILES_ACTIVE=prod and provide the environment variables.
    default: dev
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
order:
  relay:
    enabled: true
  eca:
    enabled: true
  integration:
    party-base-url: ${ORDER_PARTY_BASE_URL:http://localhost:8080}
    product-base-url: ${ORDER_PRODUCT_BASE_URL:http://localhost:8080}
    inventory-base-url: ${ORDER_INVENTORY_BASE_URL:http://localhost:8080}
