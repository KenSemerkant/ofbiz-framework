# Production profile: TLS verification stays on; endpoints and broker
# credentials come from the environment.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IDENTITY_ISSUER}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:true}
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          # HTTP/protobuf OTLP to the Jaeger collector (grpc sender artifact
          # is not resolvable under the Boot BOM's OTel constraint).
          # Boot 4 property path — the 3.x management.otlp.tracing.* keys
          # are deprecated no-ops.
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger-collector.observability.svc:4318/v1/traces}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
