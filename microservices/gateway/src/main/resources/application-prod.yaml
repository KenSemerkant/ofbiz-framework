# Production profile: TLS verification stays on; endpoints and broker
# credentials come from the environment.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IDENTITY_ISSUER}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:true}
management:
  otlp:
    tracing:
      # Jaeger collector accepts OTLP gRPC on 4317 (platform/observability-stack.yaml)
      transport: grpc
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger-collector.observability.svc:4317}
