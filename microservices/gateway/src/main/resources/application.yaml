spring:
  application:
    name: gateway
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - SecureHeaders
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins:
                  - ${SPA_ORIGIN:http://localhost:4200}
                allowedMethods: "*"
                allowedHeaders: "*"
          routes:
            - id: demo-svc
              uri: ${gateway.demo.uri:http://localhost:18081}
              predicates:
                - Path=/api/v1/demo/**
              filters:
                - StripPrefix=3
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 3
                    redis-rate-limiter.requestedTokens: 1
            - id: search-svc
              uri: ${gateway.search.uri:http://search-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/search/**
            - id: party-svc
              uri: ${gateway.party.uri:http://party-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/parties/**
              metadata:
                required-role: CUSTOMER
            # P3-GATE write cutover: catalog reads/writes go to product-svc
            # (rollback = flip gateway.product.uri back to the monolith)
            - id: product-svc
              uri: ${gateway.product.uri:http://product-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/stores/**
              metadata:
                required-role: CUSTOMER
            # P4-GATE write cutover: order writes go to order-svc (monolith
            # order tables stay current via reverse-sync; rollback = flip
            # gateway.order.uri back to the monolith bridge)
            - id: order-svc
              uri: ${gateway.order.uri:http://order-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/orders/**,/api/v1/quotes/**,/api/v1/returns/**,/api/v1/attributions/**
              metadata:
                required-role: CUSTOMER
            # P5-GATE: billing + finance APIs served by the new services
            # (accounting screens in the monolith are read-only reference;
            # rollback = flip gateway.billing.uri / gateway.finance.uri)
            - id: billing-svc
              uri: ${gateway.billing.uri:http://billing-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/invoices/**,/api/v1/payments/**,/api/v1/billing-accounts/**
              metadata:
                required-role: CUSTOMER
            - id: finance-svc
              uri: ${gateway.finance.uri:http://finance-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/gl/**
              metadata:
                required-role: CUSTOMER
            # P6-GATE: long-tail domain APIs served by the new services
            # (rollback = flip gateway.<svc>.uri per service)
            - id: manufacturing-svc
              uri: ${gateway.manufacturing.uri:http://manufacturing-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/boms/**,/api/v1/routings/**,/api/v1/mrp/**
              metadata:
                required-role: CUSTOMER
            - id: workeffort-svc
              uri: ${gateway.workeffort.uri:http://workeffort-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/workefforts/**,/api/v1/timesheets/**
              metadata:
                required-role: CUSTOMER
            - id: humanres-svc
              uri: ${gateway.humanres.uri:http://humanres-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/positions/**,/api/v1/employments/**,/api/v1/onboarding/**
              metadata:
                required-role: CUSTOMER
            - id: content-svc
              uri: ${gateway.content.uri:http://content-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/contents/**
              metadata:
                required-role: CUSTOMER
            - id: marketing-svc
              uri: ${gateway.marketing.uri:http://marketing-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/campaigns/**,/api/v1/tracking-codes/**,/api/v1/opportunities/**,/api/v1/attribution/**
              metadata:
                required-role: CUSTOMER
            - id: monolith
              uri: ${gateway.monolith.uri:https://ofbiz-monolith.ofbiz.svc:8443}
              predicates:
                - Path=/webtools/**
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
