spring:
  application:
    name: gateway
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - SecureHeaders
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins:
                  - ${SPA_ORIGIN:http://localhost:4200}
                allowedMethods: "*"
                allowedHeaders: "*"
          routes:
            - id: demo-svc
              uri: ${gateway.demo.uri:http://localhost:18081}
              predicates:
                - Path=/api/v1/demo/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 3
                    redis-rate-limiter.requestedTokens: 1
            - id: monolith
              uri: ${gateway.monolith.uri:https://ofbiz-monolith.ofbiz.svc:8443}
              predicates:
                - Path=/webtools/**
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
