spring:
  application:
    name: gateway
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webflux:
          filter:
            secure-headers:
              # SecureHeaders defaults Referrer-Policy to no-referrer, which
              # makes browsers send `Origin: null` on the OIDC login form
              # POST — Spring Security's CSRF Origin check 403s it. Use the
              # browser default instead.
              referrer-policy: strict-origin-when-cross-origin
          default-filters:
            - SecureHeaders
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins:
                  - ${SPA_ORIGIN:http://localhost:4200}
                allowedMethods: "*"
                allowedHeaders: "*"
          routes:
            # OIDC passthrough: the SPA sends the browser here for the
            # auth-code+PKCE dance (login page, authorize, token, JWKS).
            # Public by design — no required-role.
            - id: identity-svc
              uri: ${gateway.identity.uri:http://identity-svc.ofbiz.svc:8080}
              predicates:
                - Path=/oauth2/**,/login/**,/logout/**,/.well-known/**
              filters:
                # Identity builds redirects from its in-cluster host; the
                # browser must land back on the public origin. Rewrite the
                # internal host out of Location headers (dev default:
                # localhost:8080 port-forward; set gateway.public-origin to
                # the ingress URL on other profiles).
                - RewriteResponseHeader=Location, ^https?://identity-svc(\.ofbiz\.svc)?(:\d+)?, ${gateway.public-origin:http://localhost:8080}
            - id: demo-svc
              uri: ${gateway.demo.uri:http://localhost:18081}
              predicates:
                - Path=/api/v1/demo/**
              filters:
                - StripPrefix=3
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 3
                    redis-rate-limiter.requestedTokens: 1
            - id: search-svc
              uri: ${gateway.search.uri:http://search-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/search/**
            - id: party-svc
              uri: ${gateway.party.uri:http://party-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/parties/**
              metadata:
                required-role: CUSTOMER
            # P3-GATE write cutover: catalog reads/writes go to product-svc
            - id: product-svc
              uri: ${gateway.product.uri:http://product-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/stores/**
              metadata:
                required-role: CUSTOMER
            # P4-GATE write cutover: order writes go to order-svc
            - id: order-svc
              uri: ${gateway.order.uri:http://order-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/orders/**,/api/v1/quotes/**,/api/v1/returns/**,/api/v1/attributions/**
              metadata:
                required-role: CUSTOMER
            # P5-GATE: billing + finance APIs served by the new services
            - id: billing-svc
              uri: ${gateway.billing.uri:http://billing-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/invoices/**,/api/v1/payments/**,/api/v1/billing-accounts/**
              metadata:
                required-role: CUSTOMER
            - id: finance-svc
              uri: ${gateway.finance.uri:http://finance-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/gl/**
              metadata:
                required-role: CUSTOMER
            # P6-GATE: long-tail domain APIs served by the new services
            # (rollback = flip gateway.<svc>.uri per service)
            - id: manufacturing-svc
              uri: ${gateway.manufacturing.uri:http://manufacturing-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/boms/**,/api/v1/routings/**,/api/v1/mrp/**
              metadata:
                required-role: CUSTOMER
            - id: workeffort-svc
              uri: ${gateway.workeffort.uri:http://workeffort-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/workefforts/**,/api/v1/timesheets/**
              metadata:
                required-role: CUSTOMER
            - id: humanres-svc
              uri: ${gateway.humanres.uri:http://humanres-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/positions/**,/api/v1/employments/**,/api/v1/onboarding/**
              metadata:
                required-role: CUSTOMER
            - id: content-svc
              uri: ${gateway.content.uri:http://content-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/contents/**
              metadata:
                required-role: CUSTOMER
            - id: marketing-svc
              uri: ${gateway.marketing.uri:http://marketing-svc.ofbiz.svc:8080}
              predicates:
                - Path=/api/v1/campaigns/**,/api/v1/tracking-codes/**,/api/v1/opportunities/**,/api/v1/attribution/**
              metadata:
                required-role: CUSTOMER
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
