syntax = "proto3";

package party.v1;

option java_package = "party.v1";
option java_outer_classname = "PartyOuterClass";

// East-west contract (ADR-010, FUTURESTATE §5.1).
service PartyApi {
  rpc GetParty(GetPartyRequest) returns (PartyResponse);
  rpc UpsertParty(UpsertPartyRequest) returns (PartyResponse);
  rpc FindPartiesByRole(FindPartiesByRoleRequest) returns (FindPartiesByRoleResponse);
}

message GetPartyRequest {
  string party_id = 1;
}

message UpsertPartyRequest {
  string party_id = 1;
  string kind = 2;          // PERSON | PARTY_GROUP
  string first_name = 3;    // PERSON only
  string last_name = 4;     // PERSON only
  string group_name = 5;    // PARTY_GROUP only
  repeated string roles = 6;
}

message PartyResponse {
  string party_id = 1;
  string kind = 2;
  string display_name = 3;
  repeated string roles = 4;
}

message FindPartiesByRoleRequest {
  string role = 1;
  int32 page = 2;
  int32 size = 3;
}

message FindPartiesByRoleResponse {
  repeated PartySummary items = 1;
  int32 page = 2;
  int32 size = 3;
  int64 total_elements = 4;
  int32 total_pages = 5;
}

message PartySummary {
  string party_id = 1;
  string kind = 2;
  string display_name = 3;
}
