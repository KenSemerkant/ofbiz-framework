spring:
  application:
    name: audit-svc
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: audit-svc
      auto-offset-reset: earliest
      properties:
        # wildcard subscription needs topic discovery faster than the 5m default
        metadata.max.age.ms: 10000
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
