spring:
  application:
    name: search-svc
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  # P3-F3-S1: consumer idempotency + category-name projection live in the
  # search database (DB-per-service, ADR-007).
  datasource:
    url: ${SEARCH_DB_URL:jdbc:postgresql://localhost:5432/search}
    username: ${SEARCH_DB_USER:search}
    password: ${SEARCH_DB_PASSWORD:search}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: search-svc
      auto-offset-reset: earliest
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
search:
  opensearch:
    uris: ${OPENSEARCH_URIS:http://localhost:9200}
  grpc:
    port: ${SEARCH_GRPC_PORT:9090}
  topic: search.doc.indexed.v1
