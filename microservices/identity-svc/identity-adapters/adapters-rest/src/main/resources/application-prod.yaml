# Production profile: every credential comes from the environment and has no
# fallback, so a missing variable fails startup instead of booting with a
# known development secret.
server:
  # The SPA reaches identity through the gateway (localhost:8080 or the
  # istio ingress). Honor X-Forwarded-Host/Port (SCG sets them) so login
  # redirects point at the external origin, not identity-svc.ofbiz.svc.
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${IDENTITY_DB_URL}
    username: ${IDENTITY_DB_USER}
    password: ${IDENTITY_DB_PASSWORD}
  security:
    oauth2:
      authorizationserver:
        issuer: ${IDENTITY_ISSUER}
        client:
          gateway:
            registration:
              client-id: ${GATEWAY_CLIENT_ID}
              client-secret: ${GATEWAY_CLIENT_SECRET}
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - authorization_code
                - client_credentials
                - refresh_token
              redirect-uris:
                - ${GATEWAY_REDIRECT_URI}
              scopes:
                - openid
              require-proof-key: true

  # Kafka mTLS material (mounted from the KafkaUser PEM secret by
  # platform/services/10-deploy.sh; activated with SPRING_KAFKA_SSL_BUNDLE=kafka).
  ssl:
    bundle:
      pem:
        kafka:
          truststore:
            certificate: ${KAFKA_TLS_CA:/etc/kafka-tls/ca.crt}
          keystore:
            certificate: ${KAFKA_TLS_CERT:/etc/kafka-tls/user.crt}
            privateKey: ${KAFKA_TLS_KEY:/etc/kafka-tls/user.key}
