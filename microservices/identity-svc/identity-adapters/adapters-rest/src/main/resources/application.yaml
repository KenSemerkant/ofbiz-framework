spring:
  application:
    name: identity-svc
  threads:
    virtual:
      enabled: true
  security:
    user:
      name: test-user
      password: "{noop}test-password"
    oauth2:
      authorizationserver:
        issuer: http://localhost:8080
        client:
          gateway-test-client:
            registration:
              client-id: gateway-test-client
              client-secret: "{noop}test-secret"
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - authorization_code
                - client_credentials
                - refresh_token
              redirect-uris:
                - http://127.0.0.1:8080/login/oauth2/code/gateway
              scopes:
                - openid
              require-proof-key: true
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
