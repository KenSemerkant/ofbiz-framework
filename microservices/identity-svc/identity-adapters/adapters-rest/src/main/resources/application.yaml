spring:
  application:
    name: identity-svc
  profiles:
    # Local/dev boot works out of the box; production must set
    # SPRING_PROFILES_ACTIVE=prod and provide the environment variables.
    default: dev
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: identity-svc
      auto-offset-reset: earliest
  security:
    oauth2:
      authorizationserver:
        issuer: ${IDENTITY_ISSUER:http://localhost:8080}
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
identity:
  relay:
    enabled: true
party:
  consumer:
    enabled: true
