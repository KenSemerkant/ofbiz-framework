name: ci

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit + contract tests (ArchUnit layering + domain coverage enforced)
        run: ./gradlew build

  # Every runnable service gets the same image gate: build bootJar, distroless
  # image, trivy HIGH/CRITICAL gate, GHCR push on trunk.
  service-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: demo-svc
            dir: platform/demo-svc
            gradle: ":platform:demo-svc:demo-adapters:adapters-rest:bootJar"
          - name: identity-svc
            dir: microservices/identity-svc
            gradle: ":microservices:identity-svc:identity-adapters:adapters-rest:bootJar"
          - name: gateway
            dir: microservices/gateway
            gradle: ":microservices:gateway:bootJar"
          - name: audit-svc
            dir: microservices/audit-svc
            gradle: ":microservices:audit-svc:audit-adapters:adapters-rest:bootJar"
          - name: notification-svc
            dir: microservices/notification-svc
            gradle: ":microservices:notification-svc:notification-adapters:adapters-rest:bootJar"
          - name: search-svc
            dir: microservices/search-svc
            gradle: ":microservices:search-svc:search-adapters:adapters-rest:bootJar"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build bootJar
        run: ./gradlew ${{ matrix.gradle }}
      - name: Build image
        run: docker build -t "${{ matrix.name }}:ci" "${{ matrix.dir }}"
      - name: Trivy scan (gate on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push'
        env:
          # GHCR requires lowercase repository names
          IMAGE: ghcr.io/${{ format('{0}', github.repository_owner) }}/${{ matrix.name }}
        run: |
          IMAGE="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
          docker tag "${{ matrix.name }}:ci" "${IMAGE}:${{ github.sha }}"
          docker tag "${{ matrix.name }}:ci" "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

  # P0-F2-S3: Avro contract pipeline — register sample OrderPlaced against a
  # schema registry, enforce BACKWARD compatibility. The incompatible-change
  # rejection below is the gate that must fail the CI run.
  contracts:
    runs-on: ubuntu-latest
    services:
      registry:
        image: quay.io/apicurio/apicurio-registry-mem:2.6.x-release
        ports:
          - 8080:8080
    env:
      REGISTRY: http://localhost:8080/apis/registry/v2/groups/order/artifacts
    steps:
      - uses: actions/checkout@v4
      - name: Wait for schema registry readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "http://localhost:8080/apis/registry/v2/system/info"; then echo ready; exit 0; fi
            sleep 2
          done
          echo "registry never became ready"; exit 1
      - name: Register order.v1.OrderPlaced + set BACKWARD rule
        run: |
          curl -sf -X POST "${REGISTRY}?ifExists=RETURN" \
            -H "X-Registry-ArtifactId: order-placed" \
            -H "X-Registry-ArtifactType: AVRO" \
            -H "Content-Type: application/json" \
            --data-binary @contracts/order/v1/OrderPlaced.avsc
          curl -sf -X POST "${REGISTRY}/order-placed/rules" \
            -H "Content-Type: application/json" \
            -d '{"type":"COMPATIBILITY","config":"BACKWARD"}'
      - name: BACKWARD gate rejects an incompatible change
        run: |
          cat > /tmp/incompatible.avsc <<'EOF'
          {
            "type": "record",
            "name": "OrderPlaced",
            "namespace": "ofbiz.order.v1",
            "fields": [
              { "name": "orderId", "type": "string" },
              { "name": "customerId", "type": "string" },
              { "name": "placedAt", "type": { "type": "long", "logicalType": "timestamp-millis" } },
              { "name": "grandTotal", "type": { "type": "bytes", "logicalType": "decimal", "precision": 18, "scale": 2 } },
              { "name": "currency", "type": "string" },
              { "name": "lineCount", "type": "int" },
              { "name": "riskScore", "type": "int" }
            ]
          }
          EOF
          CODE=$(curl -s -o /tmp/resp -w '%{http_code}' \
            -X POST "${REGISTRY}/order-placed/versions" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/incompatible.avsc)
          echo "incompatible register → HTTP ${CODE}"; cat /tmp/resp
          [ "${CODE}" = "409" ] || { echo "FAIL: expected 409, got ${CODE}"; exit 1; }
      - name: BACKWARD gate accepts a compatible change
        run: |
          cat > /tmp/compatible.avsc <<'EOF'
          {
            "type": "record",
            "name": "OrderPlaced",
            "namespace": "ofbiz.order.v1",
            "fields": [
              { "name": "orderId", "type": "string" },
              { "name": "customerId", "type": "string" },
              { "name": "placedAt", "type": { "type": "long", "logicalType": "timestamp-millis" } },
              { "name": "grandTotal", "type": { "type": "bytes", "logicalType": "decimal", "precision": 18, "scale": 2 } },
              { "name": "currency", "type": "string" },
              { "name": "lineCount", "type": "int" },
              { "name": "channel", "type": ["null", "string"], "default": null }
            ]
          }
          EOF
          curl -sf -X POST "${REGISTRY}/order-placed/versions" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/compatible.avsc > /dev/null
          echo "compatible register → accepted"
