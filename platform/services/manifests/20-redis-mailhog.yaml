# P1-F6: local-profile backing stores — Redis for the gateway rate limiter,
# MailHog as the staging SMTP sink for notification-svc. Dev-only.
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: ofbiz}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis, sidecar.istio.io/inject: "false"}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          readinessProbe:
            tcpSocket: {port: 6379}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: ofbiz}
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
# P5: mailpit (the maintained mailhog successor; MailHog-compatible API).
# SMTP listens on 8080 because the local kind datapath eats a server's
# first unsolicited data packet — client-first traffic (HTTP and the eager
# SMTP adapter) flows on service ports, banner-first SMTP on 1025/2525
# blackholes (issues/P5-GATE.md). notification-svc pairs with the eager
# client-first adapter (notification.mail.eager=true).
apiVersion: apps/v1
kind: Deployment
metadata: {name: mailhog, namespace: ofbiz}
spec:
  replicas: 1
  selector: {matchLabels: {app: mailhog}}
  template:
    metadata: {labels: {app: mailhog, sidecar.istio.io/inject: "false"}}
    spec:
      containers:
        - name: mailhog
          image: axllent/mailpit:latest
          args: ["--smtp", "0.0.0.0:8080"]
          ports: [{containerPort: 8080, name: smtp}, {containerPort: 8025, name: ui}]
---
apiVersion: v1
kind: Service
metadata: {name: mailhog, namespace: ofbiz}
spec:
  selector: {app: mailhog}
  ports: [{name: smtp, port: 8080}, {name: ui, port: 8025}]
