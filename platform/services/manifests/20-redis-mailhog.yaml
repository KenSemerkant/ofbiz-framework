# P1-F6: local-profile backing stores — Redis for the gateway rate limiter,
# MailHog as the staging SMTP sink for notification-svc. Dev-only.
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: ofbiz}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis, sidecar.istio.io/inject: "false"}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          readinessProbe:
            tcpSocket: {port: 6379}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: ofbiz}
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mailhog, namespace: ofbiz}
spec:
  replicas: 1
  selector: {matchLabels: {app: mailhog}}
  template:
    metadata: {labels: {app: mailhog, sidecar.istio.io/inject: "false"}}
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          ports: [{containerPort: 1025}, {containerPort: 8025}]
---
apiVersion: v1
kind: Service
metadata: {name: mailhog, namespace: ofbiz}
spec:
  selector: {app: mailhog}
  ports: [{name: smtp, port: 1025}, {name: ui, port: 8025}]
