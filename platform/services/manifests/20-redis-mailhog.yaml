# P1-F6: local-profile backing stores — Redis for the gateway rate limiter,
# MailHog as the staging SMTP sink for notification-svc. Dev-only.
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: ofbiz}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis, sidecar.istio.io/inject: "false"}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          readinessProbe:
            tcpSocket: {port: 6379}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: ofbiz}
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
# P5: mailpit (the maintained mailhog successor; same ports +
# MailHog-compatible API). Mesh-injected like every other service —
# under STRICT mTLS a non-meshed mail backend silently blackholes SMTP
# from meshed clients (envoy completes the TCP handshake, the plaintext
# stream never reaches the app).
apiVersion: apps/v1
kind: Deployment
metadata: {name: mailhog, namespace: ofbiz}
spec:
  replicas: 1
  selector: {matchLabels: {app: mailhog}}
  template:
    metadata: {labels: {app: mailhog}}
    spec:
      containers:
        - name: mailhog
          image: axllent/mailpit:latest
          ports: [{containerPort: 1025, name: smtp}, {containerPort: 8025, name: ui}]
---
apiVersion: v1
kind: Service
metadata: {name: mailhog, namespace: ofbiz}
spec:
  selector: {app: mailhog}
  ports: [{name: smtp, port: 1025}, {name: ui, port: 8025}]
