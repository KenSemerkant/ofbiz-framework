# Kafka cluster for the local kind environment (P0-F2-S1).
# Strimzi 1.x: v1 API, KRaft via KafkaNodePool (broker+controller roles).
# 3 brokers per story AC (one-broker-kill must not lose data).
# Local-dev sized; production values come with the cloud cluster.
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: ofbiz
  namespace: ofbiz
spec:
  kafka:
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    authorization:
      type: simple
    config:
      # ACL story (P0-F2-S2): simple authz is ON so KafkaUser ACL manifests
      # are valid, but allow-everyone keeps the unauthenticated internal
      # listener open for local verify tooling — i.e., enforcement is
      # PARTIAL locally (super.users + per-user checks misbehaved on this
      # Strimzi 1.3.0 / Kafka 4.3.1 combined-node cluster; full enforcement
      # evidence deferred to the cloud profile). Cloud profile: flip to
      # "false" + tls-auth on every listener.
      allow.everyone.if.no.acl.found: "true"
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: ofbiz-nodes
  namespace: ofbiz
  labels:
    strimzi.io/cluster: ofbiz
spec:
  replicas: 3
  roles: [broker, controller]
  storage:
    type: persistent-claim
    size: 5Gi
    deleteClaim: true
  resources:
    requests: {memory: 1Gi, cpu: 300m}
    limits: {memory: 1Gi, cpu: "1"}
