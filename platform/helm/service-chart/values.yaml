# Shared service chart defaults (P0-F4-S2). Override per service.
nameOverride: ""
replicaCount: 2

image:
  repository: demo-svc
  tag: dev
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

# Optional extra container/service port (e.g. search-svc gRPC on 9090).
grpcPort: null

# Raw env list (name/value) passed straight to the container.
env: []

# Additional env entries merged after `env` (e.g. Kafka TLS properties).
extraEnv: []

# Optional raw volumes/volumeMounts (e.g. KafkaUser TLS secrets).
extraVolumes: []
extraVolumeMounts: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# HPA on CPU; disabled when autoscaling.enabled=false (e.g. single-node kind).
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podAnnotations:
  sidecar.istio.io/inject: "true"

probes:
  readiness: /actuator/health/readiness
  liveness: /actuator/health/liveness
