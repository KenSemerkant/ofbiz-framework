apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
    {{- if .Values.grpcPort }}
    - port: {{ .Values.grpcPort }}
      targetPort: grpc
      name: grpc
    {{- end }}
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
