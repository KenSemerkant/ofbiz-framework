# CG-2: SPA skeleton (nginx, no build step). Served on :4200 to match the
# gateway CORS allow-list and the identity redirect URI. The index.html
# ConfigMap is created by 10-install.sh (kubectl create configmap --from-file).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spa
  namespace: ofbiz
spec:
  replicas: 1
  selector:
    matchLabels: {app: spa}
  template:
    metadata:
      labels: {app: spa}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            - {name: index, mountPath: /usr/share/nginx/html}
            - {name: conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - name: index
          configMap: {name: spa-index}
        - name: conf
          configMap:
            name: spa-nginx-conf
            items: [{key: default.conf, path: default.conf}]
---
apiVersion: v1
kind: Service
metadata:
  name: spa
  namespace: ofbiz
spec:
  selector: {app: spa}
  ports: [{port: 4200, targetPort: 80}]
