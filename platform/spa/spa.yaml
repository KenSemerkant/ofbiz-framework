# P8: built SPA image (Vite dist in nginx). Served on :4200 to match the
# gateway CORS allow-list and the identity redirect URI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spa
  namespace: ofbiz
spec:
  replicas: 1
  selector:
    matchLabels: {app: spa}
  template:
    metadata:
      labels: {app: spa}
    spec:
      containers:
        - name: nginx
          image: spa:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: spa
  namespace: ofbiz
spec:
  selector: {app: spa}
  ports: [{port: 4200, targetPort: 80}]
