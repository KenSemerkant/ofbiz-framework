<!doctype html>
<!-- CG-2 SPA skeleton: OIDC (authorization code + PKCE) login, then lists
     and searches parties through the gateway (GET /api/v1/parties).
     P3-GATE: catalog browse + price lookup through product-svc's new APIs
     (GET /api/v1/products, GET /api/v1/products/{id}/price). No framework,
     no build step — later phases grow this into the real SPA. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OFBiz — Parties &amp; Catalog</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    table { border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: .4rem .8rem; text-align: left; }
    #msg { color: #b00; }
    h2 { margin-top: 2rem; }
  </style>
</head>
<body>
  <h1>Parties</h1>
  <p id="msg"></p>
  <button id="login">Sign in</button>
  <form id="search"><input id="q" placeholder="role, e.g. CUSTOMER"><button>Search</button></form>
  <table><thead><tr><th>ID</th><th>Kind</th><th>Name</th></tr></thead><tbody id="rows"></tbody></table>

  <h2>Catalog</h2>
  <p id="cmsg"></p>
  <button id="catalog">Browse catalog</button>
  <table><thead><tr><th>ID</th><th>Internal name</th><th>Product name</th><th>Price (USD)</th></tr></thead><tbody id="crows"></tbody></table>

  <h2>Long-tail domains (P6)</h2>
  <p id="p6msg"></p>
  <!-- P6-GATE S3: CRUD screens for the five long-tail primary entities.
       One generic widget per domain: create via POST, read back via GET. -->
  <div id="p6"></div>

  <script>
    // dev: SPA on :4200, gateway on :8080 (same host)
    const GATEWAY = location.origin.replace(/:\d+$/, ':8080');
    // Registered redirect URI on identity-svc (GATEWAY_REDIRECT_URI env).
    // nginx serves index.html for any path (try_files), so this callback
    // path lands back on this page with ?code=... below.
    const REDIRECT = location.origin + '/login/oauth2/code/gateway';
    // dev skeleton only: the registered client authenticates via
    // client_secret_basic (PKCE still enforced); the SPA is trusted with
    // the dev-local secret. A public client needs its own registration.
    const BASIC = 'Basic ' + btoa('gateway:dev-local-secret');

    const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

    document.getElementById('login').onclick = async () => {
      const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
      sessionStorage.setItem('verifier', verifier);
      const challenge = b64url(await crypto.subtle.digest('SHA-256',
        new TextEncoder().encode(verifier)));
      const auth = new URL(GATEWAY + '/oauth2/authorize');
      auth.search = new URLSearchParams({ response_type: 'code', client_id: 'gateway',
        redirect_uri: REDIRECT, scope: 'openid', code_challenge: challenge,
        code_challenge_method: 'S256' });
      location = auth;
    };

    const params = new URLSearchParams(location.search);
    if (params.get('code')) {
      (async () => {
        const res = await fetch(GATEWAY + '/oauth2/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded', Authorization: BASIC },
          body: new URLSearchParams({ grant_type: 'authorization_code',
            code: params.get('code'), client_id: 'gateway', redirect_uri: REDIRECT,
            code_verifier: sessionStorage.getItem('verifier') }) });
        if (!res.ok) { document.getElementById('msg').textContent = 'token exchange failed: ' + res.status; return; }
        sessionStorage.setItem('token', (await res.json()).access_token);
        history.replaceState(null, '', location.pathname);
        load('CUSTOMER');
      })();
    }

    async function load(role) {
      const token = sessionStorage.getItem('token');
      if (!token) return;
      const res = await fetch(
        `${GATEWAY}/api/v1/parties?role=${encodeURIComponent(role)}&page=0&size=20`,
        { headers: { Authorization: 'Bearer ' + token } });
      if (res.status === 403) { document.getElementById('msg').textContent = '403 — token lacks the required role'; return; }
      if (!res.ok) { document.getElementById('msg').textContent = 'gateway error ' + res.status; return; }
      const page = await res.json();
      document.getElementById('rows').innerHTML = (page.items || []).map(p =>
        `<tr><td>${p.partyId}</td><td>${p.kind}</td><td>${p.displayName}</td></tr>`).join('');
      document.getElementById('msg').textContent =
        `${page.totalElements} parties (page ${page.page + 1}/${page.totalPages})`;
    }

    document.getElementById('search').onsubmit = e => {
      e.preventDefault();
      load(document.getElementById('q').value || 'CUSTOMER');
    };

    // P3-GATE catalog browse: one page of products from product-svc via the
    // gateway; per-row price lookup via the price-resolution API.
    async function loadCatalog() {
      const token = sessionStorage.getItem('token');
      if (!token) { document.getElementById('cmsg').textContent = 'sign in first'; return; }
      const res = await fetch(`${GATEWAY}/api/v1/products?page=0&size=20`,
        { headers: { Authorization: 'Bearer ' + token } });
      if (res.status === 403) { document.getElementById('cmsg').textContent = '403 — token lacks the required role'; return; }
      if (!res.ok) { document.getElementById('cmsg').textContent = 'gateway error ' + res.status; return; }
      const page = await res.json();
      document.getElementById('crows').innerHTML = (page.items || []).map(p =>
        `<tr><td>${p.productId}</td><td>${p.internalName}</td><td>${p.productName ?? ''}</td>` +
        `<td id="price-${p.productId}"><button onclick="lookupPrice('${p.productId}')">lookup</button></td></tr>`).join('');
      document.getElementById('cmsg').textContent =
        `${page.totalElements} products (page ${page.page + 1}/${page.totalPages})`;
    }

    async function lookupPrice(productId) {
      const token = sessionStorage.getItem('token');
      const cell = document.getElementById('price-' + productId);
      const res = await fetch(
        `${GATEWAY}/api/v1/products/${productId}/price?currency=USD&at=${encodeURIComponent(new Date().toISOString())}`,
        { headers: { Authorization: 'Bearer ' + token } });
      cell.textContent = res.ok ? (await res.json()).price + ' USD' : 'n/a';
    }

    document.getElementById('catalog').onclick = loadCatalog;

    // P6-GATE S3: long-tail CRUD screens. config: title, endpoint, fields
    // (label + name), payload builder from the form values.
    const P6_DOMAINS = [
      { title: 'BOM (manufacturing)', endpoint: '/api/v1/boms', id: 'productId',
        fields: [['product', 'productId'], ['component', 'componentId'], ['qty', 'quantity']],
        payload: v => ({ productId: v.productId,
          components: [{ productId: v.componentId, quantity: Number(v.quantity) || 1, scrapPct: 0 }] }) },
      { title: 'Work effort (workeffort)', endpoint: '/api/v1/workefforts', id: 'workEffortId',
        fields: [['id', 'workEffortId'], ['type', 'workEffortTypeId'], ['name', 'workEffortName']],
        payload: v => ({ ...v, workEffortTypeId: v.workEffortTypeId || 'TASK' }) },
      { title: 'Position (humanres)', endpoint: '/api/v1/positions', id: 'emplPositionId',
        fields: [['id', 'emplPositionId'], ['type', 'emplPositionTypeId']],
        payload: v => ({ ...v, statusId: 'ACTIVE' }) },
      { title: 'Content', endpoint: '/api/v1/contents', id: 'contentId',
        fields: [['id', 'contentId'], ['name', 'contentName'], ['type', 'contentTypeId']],
        payload: v => ({ ...v, contentTypeId: v.contentTypeId || 'DOCUMENT' }) },
      { title: 'Campaign (marketing)', endpoint: '/api/v1/campaigns', id: 'marketingCampaignId',
        fields: [['id', 'marketingCampaignId'], ['name', 'campaignName']],
        payload: v => ({ ...v, statusId: 'ACTIVE', fromDate: '2026-01-01', thruDate: '2026-12-31' }) },
    ];

    async function api(method, path, body) {
      const token = sessionStorage.getItem('token');
      if (!token) throw new Error('sign in first');
      const res = await fetch(GATEWAY + path, {
        method,
        headers: { Authorization: 'Bearer ' + token,
          ...(body ? { 'Content-Type': 'application/json' } : {}) },
        ...(body ? { body: JSON.stringify(body) } : {}) });
      if (!res.ok) throw new Error(method + ' ' + path + ' -> ' + res.status);
      return res.json();
    }

    for (const d of P6_DOMAINS) {
      const box = document.createElement('div');
      box.innerHTML = `<h3>${d.title}</h3><form data-f="p6-${d.id}">
        ${d.fields.map(f => `<input name="${f[1]}" placeholder="${f[0]}">`).join('')}
        <button>create</button></form>
        <table><thead><tr><th>result</th></tr></thead><tbody><tr><td data-r="p6-${d.id}">—</td></tr></tbody></table>`;
      document.getElementById('p6').appendChild(box);
      box.querySelector('form').onsubmit = async e => {
        e.preventDefault();
        const cell = box.querySelector('[data-r]');
        const v = Object.fromEntries(new FormData(e.target).entries());
        try {
          await api('POST', d.endpoint, d.payload(v));
          const saved = await api('GET', `${d.endpoint}/${encodeURIComponent(v[d.id])}`);
          cell.textContent = 'saved + read back: ' + JSON.stringify(saved).slice(0, 120);
        } catch (err) { cell.textContent = err.message; }
      };
    }
  </script>
</body>
</html>
