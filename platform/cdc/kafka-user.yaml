# P2-F2-S1: identity for the Debezium KafkaConnect cluster (ADR-009 backbone,
# ADR-012 bridge). Transport is mutual-TLS; broker-side simple authz is off
# locally (P0-F2-S2 known issue) — this manifest is the cloud-profile
# enforcement source, granted write on the ofbiz.* CDC topics.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: cdc-connect
  namespace: ofbiz
  labels:
    strimzi.io/cluster: ofbiz
spec:
  authentication:
    type: tls
  # No simple-authz block: broker-side authorization stays OFF locally
  # (P0-F2-S2 known issue — principal with Write+Read grants could not
  # consume). Transport is mutual-TLS; cloud profile enforces ACLs.
