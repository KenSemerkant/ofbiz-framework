# P2-F2-S1: monolith Postgres stand-in with the OFBiz party slice (ADR-012).
# Production points Debezium at the real monolith DB; locally this carries the
# same tables/DML surface so the bridge is exercised end-to-end.
# wal_level=logical is required for Debezium (pgoutput).
apiVersion: v1
kind: ConfigMap
metadata:
  name: monolith-db-init
  namespace: ofbiz
data:
  init.sql: |
    CREATE TABLE "PARTY" (
      "PARTY_ID" VARCHAR(20) PRIMARY KEY,
      "PARTY_TYPE_ID" VARCHAR(20),
      "EXTERNAL_ID" VARCHAR(20),
      "DESCRIPTION" VARCHAR(255),
      "STATUS_ID" VARCHAR(20),
      "CREATED_DATE" TIMESTAMP,
      "LAST_UPDATED_STAMP" TIMESTAMP
    );
    CREATE TABLE "PERSON" (
      "PARTY_ID" VARCHAR(20) PRIMARY KEY REFERENCES "PARTY"("PARTY_ID"),
      "FIRST_NAME" VARCHAR(60),
      "MIDDLE_NAME" VARCHAR(60),
      "LAST_NAME" VARCHAR(60)
    );
    CREATE TABLE "PARTY_GROUP" (
      "PARTY_ID" VARCHAR(20) PRIMARY KEY REFERENCES "PARTY"("PARTY_ID"),
      "GROUP_NAME" VARCHAR(100)
    );
    CREATE TABLE "PARTY_ROLE" (
      "PARTY_ID" VARCHAR(20) NOT NULL REFERENCES "PARTY"("PARTY_ID"),
      "ROLE_TYPE_ID" VARCHAR(20) NOT NULL,
      PRIMARY KEY ("PARTY_ID", "ROLE_TYPE_ID")
    );
    -- seed: snapshot must carry pre-existing rows (10k cutover dataset later)
    INSERT INTO "PARTY" ("PARTY_ID","PARTY_TYPE_ID","STATUS_ID","CREATED_DATE")
      SELECT 'P' || g, 'PERSON', 'PARTY_ENABLED', now() FROM generate_series(1, 50) g;
    INSERT INTO "PERSON" ("PARTY_ID","FIRST_NAME","LAST_NAME")
      SELECT 'P' || g, 'First' || g, 'Last' || g FROM generate_series(1, 50) g;
    INSERT INTO "PARTY_ROLE" ("PARTY_ID","ROLE_TYPE_ID")
      SELECT 'P' || g, 'CUSTOMER' FROM generate_series(1, 50) g;
    ALTER TABLE "PARTY" REPLICA IDENTITY FULL;
    ALTER TABLE "PERSON" REPLICA IDENTITY FULL;
    ALTER TABLE "PARTY_GROUP" REPLICA IDENTITY FULL;
    ALTER TABLE "PARTY_ROLE" REPLICA IDENTITY FULL;

    -- P3-GATE: product + shipment slices (same DML surface as 12-extend-
    -- monolith-p3.sh, which applies this to an already-running DB — the
    -- volume init only runs once). FROM_DATE/PRICE/QUANTITY are TEXT so the
    -- Debezium JSON wire form (decimal.handling.mode=string, epoch dates)
    -- round-trips byte-faithful through the projections.
    CREATE TABLE "PRODUCT" (
      "PRODUCT_ID" VARCHAR(20) PRIMARY KEY,
      "PRODUCT_TYPE_ID" VARCHAR(20),
      "INTERNAL_NAME" VARCHAR(255),
      "PRODUCT_NAME" VARCHAR(255),
      "LAST_UPDATED_STAMP" TIMESTAMP
    );
    CREATE TABLE "PRODUCT_CATEGORY" (
      "PRODUCT_CATEGORY_ID" VARCHAR(20) PRIMARY KEY,
      "CATEGORY_NAME" VARCHAR(100)
    );
    CREATE TABLE "PRODUCT_CATEGORY_MEMBER" (
      "PRODUCT_ID" VARCHAR(20) NOT NULL,
      "PRODUCT_CATEGORY_ID" VARCHAR(20) NOT NULL,
      "FROM_DATE" TEXT,
      PRIMARY KEY ("PRODUCT_ID", "PRODUCT_CATEGORY_ID")
    );
    CREATE TABLE "PRODUCT_PRICE" (
      "PRODUCT_ID" VARCHAR(20) NOT NULL,
      "PRODUCT_PRICE_TYPE_ID" VARCHAR(20) NOT NULL,
      "CURRENCY_UOM_ID" VARCHAR(20) NOT NULL,
      "FROM_DATE" TEXT NOT NULL,
      "PRICE" TEXT,
      PRIMARY KEY ("PRODUCT_ID", "PRODUCT_PRICE_TYPE_ID", "CURRENCY_UOM_ID", "FROM_DATE")
    );
    CREATE TABLE "PRODUCT_ASSOC" (
      "PRODUCT_ID" VARCHAR(20) NOT NULL,
      "PRODUCT_ID_TO" VARCHAR(20) NOT NULL,
      "PRODUCT_ASSOC_TYPE_ID" VARCHAR(20) NOT NULL,
      "FROM_DATE" TEXT NOT NULL,
      PRIMARY KEY ("PRODUCT_ID", "PRODUCT_ID_TO", "PRODUCT_ASSOC_TYPE_ID", "FROM_DATE")
    );
    CREATE TABLE "SHIPMENT" (
      "SHIPMENT_ID" VARCHAR(20) PRIMARY KEY,
      "STATUS_ID" VARCHAR(30),
      "LAST_UPDATED_STAMP" TIMESTAMP
    );
    CREATE TABLE "SHIPMENT_ITEM" (
      "SHIPMENT_ID" VARCHAR(20) NOT NULL,
      "SHIPMENT_ITEM_SEQ_ID" VARCHAR(20) NOT NULL,
      "PRODUCT_ID" VARCHAR(20),
      "QUANTITY" TEXT,
      PRIMARY KEY ("SHIPMENT_ID", "SHIPMENT_ITEM_SEQ_ID")
    );
    INSERT INTO "PRODUCT" ("PRODUCT_ID","PRODUCT_TYPE_ID","INTERNAL_NAME","PRODUCT_NAME")
      SELECT 'MP' || g, 'FINISHED_GOOD', 'Monolith Product ' || g, 'Product ' || g
      FROM generate_series(1, 50) g;
    INSERT INTO "PRODUCT_CATEGORY" ("PRODUCT_CATEGORY_ID","CATEGORY_NAME")
      SELECT 'MCAT', 'Monolith Catalog' WHERE NOT EXISTS
        (SELECT 1 FROM "PRODUCT_CATEGORY" WHERE "PRODUCT_CATEGORY_ID" = 'MCAT');
    INSERT INTO "PRODUCT_CATEGORY_MEMBER" ("PRODUCT_ID","PRODUCT_CATEGORY_ID","FROM_DATE")
      SELECT 'MP' || g, 'MCAT', '0' FROM generate_series(1, 50) g;
    INSERT INTO "PRODUCT_PRICE" ("PRODUCT_ID","PRODUCT_PRICE_TYPE_ID","CURRENCY_UOM_ID","FROM_DATE","PRICE")
      SELECT 'MP' || g, 'DEFAULT_PRICE', 'USD', '0', (10 + g) || '.00'
      FROM generate_series(1, 50) g;
    INSERT INTO "SHIPMENT" ("SHIPMENT_ID","STATUS_ID")
      SELECT 'MSH' || g, 'SHIPMENT_INPUT' FROM generate_series(1, 20) g;
    INSERT INTO "SHIPMENT_ITEM" ("SHIPMENT_ID","SHIPMENT_ITEM_SEQ_ID","PRODUCT_ID","QUANTITY")
      SELECT 'MSH' || g, '00001', 'MP' || g, '2' FROM generate_series(1, 20) g;
    ALTER TABLE "PRODUCT" REPLICA IDENTITY FULL;
    ALTER TABLE "PRODUCT_CATEGORY" REPLICA IDENTITY FULL;
    ALTER TABLE "PRODUCT_CATEGORY_MEMBER" REPLICA IDENTITY FULL;
    ALTER TABLE "PRODUCT_PRICE" REPLICA IDENTITY FULL;
    ALTER TABLE "PRODUCT_ASSOC" REPLICA IDENTITY FULL;
    ALTER TABLE "SHIPMENT" REPLICA IDENTITY FULL;
    ALTER TABLE "SHIPMENT_ITEM" REPLICA IDENTITY FULL;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolith-db
  namespace: ofbiz
spec:
  replicas: 1
  selector:
    matchLabels: {app: monolith-db}
  template:
    metadata:
      labels: {app: monolith-db}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          args: ["-c", "wal_level=logical", "-c", "max_replication_slots=10"]
          env:
            - {name: POSTGRES_DB, value: ofbiz}
            - {name: POSTGRES_USER, value: ofbiz}
            - {name: POSTGRES_PASSWORD, value: ofbiz}
          ports: [{containerPort: 5432}]
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec: {command: [pg_isready, -U, ofbiz, -d, ofbiz]}
      volumes:
        - name: init
          configMap: {name: monolith-db-init}
---
apiVersion: v1
kind: Service
metadata:
  name: monolith-db
  namespace: ofbiz
spec:
  selector: {app: monolith-db}
  ports: [{port: 5432, targetPort: 5432}]
